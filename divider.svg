<svg xmlns="http://www.w3.org/2000/svg" width="800" height="14" viewBox="0 0 800 14">
  <style>
    @keyframes wm{0%{transform:translateX(0)}100%{transform:translateX(-50px)}}
    .wm{animation:wm 2s linear infinite}
  </style>
  <rect width="800" height="14" fill="#c0c0c0"/>
  <rect width="800" height="1" fill="#fff"/>
  <rect width="800" height="1" y="13" fill="#808080"/>
  <g class="wm">
    <line x1="100" y1="7" x2="700" y2="7" stroke="#000080" stroke-width=".5" opacity=".2" stroke-dasharray="3,6"/>
  </g>
  <line x1="396" y1="3" x2="396" y2="11" stroke="#808080" stroke-width=".5"/>
  <line x1="400" y1="2" x2="400" y2="12" stroke="#000080" stroke-width="1" opacity=".4"/>
  <line x1="404" y1="3" x2="404" y2="11" stroke="#808080" stroke-width=".5"/>
</svg>
