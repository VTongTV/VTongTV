<svg xmlns="http://www.w3.org/2000/svg" width="800" height="16" viewBox="0 0 800 16">
  <style>
    @keyframes wm{0%{transform:translateX(0)}100%{transform:translateX(-60px)}}
    .wm{animation:wm 2s linear infinite}
  </style>
  <rect width="800" height="16" fill="#c0c0c0"/>
  <rect width="800" height="1" fill="#ffffff"/>
  <rect width="800" height="1" y="15" fill="#808080"/>
  <!-- Animated line -->
  <g class="wm">
    <line x1="100" y1="8" x2="700" y2="8" stroke="#000080" stroke-width="1" stroke-dasharray="4,6" opacity=".25"/>
  </g>
  <!-- Center tick marks -->
  <line x1="395" y1="4" x2="395" y2="12" stroke="#808080" stroke-width="1"/>
  <line x1="400" y1="3" x2="400" y2="13" stroke="#000080" stroke-width="1.5"/>
  <line x1="405" y1="4" x2="405" y2="12" stroke="#808080" stroke-width="1"/>
</svg>
