<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <style>
    @keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes scanroll{0%{transform:translateY(-2px)}100%{transform:translateY(160px)}}
    @keyframes blink{0%,59%{opacity:1}60%,100%{opacity:0}}
    .cb{animation:cursor .8s steps(1) infinite}
    .sr{animation:scanroll 4s linear infinite}
    .rb{animation:blink 1s steps(1) infinite}
  </style>
  <defs>
    <pattern id="sc" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="transparent"/>
      <rect y="1" width="2" height="1" fill="#000" opacity=".06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" fill="#008080"/>
  <rect width="800" height="160" fill="url(#sc)"/>

  <!-- Window frame -->
  <rect x="10" y="8" width="780" height="144" fill="#c0c0c0"/>
  <!-- 3D bevel -->
  <rect x="10" y="8" width="780" height="144" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="12" y="10" width="776" height="140" fill="none" stroke="#808080" stroke-width="1"/>
  <!-- Inner area -->
  <rect x="14" y="30" width="772" height="120" fill="#008080"/>
  <rect x="14" y="30" width="772" height="120" fill="url(#sc)"/>

  <!-- Title bar -->
  <rect x="12" y="10" width="776" height="20" fill="#000080"/>
  <text x="22" y="24" font-family="'Courier New',monospace" font-size="11" fill="#fff" font-weight="700">VEDANT TONG - ML/AI ENGINEER</text>

  <!-- Window buttons -->
  <rect x="724" y="12" width="16" height="16" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="725" y="13" width="14" height="14" fill="none" stroke="#fff" stroke-width="1"/>
  <line x1="728" y1="23" x2="736" y2="17" stroke="#000" stroke-width="1.5"/>

  <rect x="744" y="12" width="16" height="16" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="745" y="13" width="14" height="14" fill="none" stroke="#fff" stroke-width="1"/>
  <rect x="748" y="16" width="8" height="7" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="748" y1="16" x2="756" y2="16" stroke="#000" stroke-width="1"/>

  <rect x="764" y="12" width="16" height="16" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="765" y="13" width="14" height="14" fill="none" stroke="#fff" stroke-width="1"/>
  <rect x="768" y="16" width="8" height="7" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="768" y="16" width="8" height="1" fill="#fff"/>
  <rect x="768" y="16" width="1" height="7" fill="#fff"/>

  <!-- Name -->
  <text x="30" y="68" font-family="'Courier New',monospace" font-size="32" fill="#ffffff" font-weight="700">VEDANT TONG</text>

  <!-- Subtitle -->
  <text x="30" y="88" font-family="'Courier New',monospace" font-size="13" fill="#ffff00" letter-spacing="3">ML / AI ENGINEER</text>

  <!-- Prompt -->
  <text x="30" y="112" font-family="'Courier New',monospace" font-size="12" fill="#ffffff" opacity=".9">C:\&gt; rebuild landmark papers from scratch. no frameworks, no shortcuts.</text>
  <rect x="470" y="102" width="8" height="13" fill="#ffffff" opacity=".9" class="cb"/>

  <!-- Status bar -->
  <rect x="14" y="138" width="772" height="12" fill="#c0c0c0"/>
  <rect x="14" y="138" width="772" height="1" fill="#808080"/>
  <text x="20" y="148" font-family="'Courier New',monospace" font-size="9" fill="#000">19 PAPERS</text>
  <line x1="82" y1="139" x2="82" y2="149" stroke="#808080" stroke-width="1"/>
  <text x="88" y="148" font-family="'Courier New',monospace" font-size="9" fill="#000">800+ TESTS</text>
  <line x1="152" y1="139" x2="152" y2="149" stroke="#808080" stroke-width="1"/>
  <text x="158" y="148" font-family="'Courier New',monospace" font-size="9" fill="#000">3 PUBLISHED</text>
  <line x1="240" y1="139" x2="240" y2="149" stroke="#808080" stroke-width="1"/>
  <text x="246" y="148" font-family="'Courier New',monospace" font-size="9" fill="#000">LC 1954 KNIGHT</text>
  <line x1="355" y1="139" x2="355" y2="149" stroke="#808080" stroke-width="1"/>
  <text x="361" y="148" font-family="'Courier New',monospace" font-size="9" fill="#000">PATENT PENDING</text>

  <!-- REC -->
  <circle cx="750" cy="144" r="3" fill="#ff0000" class="rb"/>
  <text x="758" y="148" font-family="'Courier New',monospace" font-size="9" fill="#000">LIVE</text>
</svg>
