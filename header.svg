<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <style>
    @keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes scanroll{0%{transform:translateY(-2px)}100%{transform:translateY(160px)}}
    @keyframes blink{0%,59%{opacity:1}60%,100%{opacity:0}}
    .cb{animation:cursor .8s steps(1) infinite}
    .sr{animation:scanroll 4s linear infinite}
    .rb{animation:blink 1s steps(1) infinite}
  </style>
  <defs>
    <pattern id="sc" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="transparent"/>
      <rect y="1" width="2" height="1" fill="#000" opacity=".06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" fill="#008080"/>

  <!-- CRT scanline overlay -->
  <rect width="800" height="160" fill="url(#sc)"/>

  <!-- Window title bar -->
  <rect x="12" y="8" width="776" height="144" fill="#c0c0c0" rx="0"/>
  <!-- Title bar -->
  <rect x="12" y="8" width="776" height="22" fill="#000080"/>
  <!-- 3D bevel outer -->
  <rect x="12" y="8" width="776" height="144" fill="none" stroke="#ffffff" stroke-width="1" rx="0"/>
  <rect x="13" y="9" width="774" height="142" fill="none" stroke="#808080" stroke-width="1"/>
  <!-- Inner bevel -->
  <rect x="14" y="30" width="772" height="120" fill="none" stroke="#808080" stroke-width="1"/>
  <rect x="15" y="31" width="770" height="118" fill="#008080"/>
  <!-- Scanlines on inner area -->
  <rect x="15" y="31" width="770" height="118" fill="url(#sc)"/>

  <!-- Title bar text -->
  <text x="24" y="23" font-family="'Courier New',monospace" font-size="12" fill="#ffffff" font-weight="700">VEDANT TONG — ML/AI ENGINEER</text>

  <!-- Window buttons (minimize, maximize, close) -->
  <rect x="726" y="11" width="18" height="16" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="727" y="12" width="16" height="14" fill="none" stroke="#ffffff" stroke-width="1"/>
  <line x1="730" y1="22" x2="740" y2="12" stroke="#000" stroke-width="1"/>
  <line x1="740" y1="22" x2="730" y2="12" stroke="#000" stroke-width="1"/>

  <rect x="748" y="11" width="18" height="16" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="749" y="12" width="16" height="14" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="752" y="15" width="10" height="9" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="752" y1="15" x2="762" y2="15" stroke="#000" stroke-width="1"/>

  <rect x="770" y="11" width="18" height="16" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="771" y="12" width="16" height="14" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="774" y="15" width="10" height="9" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="774" y="15" width="10" height="1" fill="#ffffff"/>
  <rect x="774" y="15" width="1" height="9" fill="#ffffff"/>

  <!-- Name - large, bold -->
  <text x="30" y="68" font-family="'Courier New',monospace" font-size="32" fill="#ffffff" font-weight="700">VEDANT TONG</text>

  <!-- Subtitle -->
  <text x="30" y="88" font-family="'Courier New',monospace" font-size="13" fill="#ffff00" letter-spacing="3">ML / AI ENGINEER</text>

  <!-- Tagline with cursor -->
  <text x="30" y="112" font-family="'Courier New',monospace" font-size="12" fill="#ffffff" opacity=".85">C:\> rebuild landmark papers from scratch. no frameworks.</text>
  <rect x="486" y="102" width="8" height="13" fill="#ffffff" opacity=".9" class="cb"/>

  <!-- Bottom status bar -->
  <rect x="14" y="138" width="772" height="12" fill="#c0c0c0"/>
  <rect x="14" y="138" width="772" height="1" fill="#808080"/>
  <text x="20" y="148" font-family="'Courier New',monospace" font-size="9" fill="#000">19 PAPERS</text>
  <line x1="82" y1="139" x2="82" y2="149" stroke="#808080" stroke-width="1"/>
  <text x="88" y="148" font-family="'Courier New',monospace" font-size="9" fill="#000">800+ TESTS</text>
  <line x1="152" y1="139" x2="152" y2="149" stroke="#808080" stroke-width="1"/>
  <text x="158" y="148" font-family="'Courier New',monospace" font-size="9" fill="#000">3 PUBLISHED</text>
  <line x1="240" y1="139" x2="240" y2="149" stroke="#808080" stroke-width="1"/>
  <text x="246" y="148" font-family="'Courier New',monospace" font-size="9" fill="#000">2 DEPLOYED</text>

  <!-- REC indicator in status bar -->
  <circle cx="750" cy="144" r="3" fill="#ff0000" class="rb"/>
  <text x="758" y="148" font-family="'Courier New',monospace" font-size="9" fill="#000">LIVE</text>

  <!-- Scanline roll -->
  <rect x="15" y="0" width="770" height="1.5" fill="#ffffff" opacity=".03" class="sr"/>
</svg>
