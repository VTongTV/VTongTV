<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <style>
    @keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes scanroll{0%{transform:translateY(-2px)}100%{transform:translateY(160px)}}
    @keyframes blink{0%,59%{opacity:1}60%,100%{opacity:0}}
    @keyframes glitch-r{0%,88%,94%,100%{transform:translateX(2px);opacity:.08}90%{transform:translateX(8px) skewX(-2deg);opacity:.3}92%{transform:translateX(-4px);opacity:.15}}
    @keyframes glitch-b{0%,88%,94%,100%{transform:translateX(-2px);opacity:.08}90%{transform:translateX(-8px) skewX(2deg);opacity:.3}92%{transform:translateX(4px);opacity:.15}}
    @keyframes glitch-m{0%,88%,94%,100%{transform:translateX(0)}90%{transform:translateX(-2px) skewX(-1deg)}92%{transform:translateX(3px) skewX(.5deg)}}
    .cb{animation:cursor .8s steps(1) infinite}
    .sr{animation:scanroll 4.5s linear infinite}
    .rb{animation:blink 1s steps(1) infinite}
    .gr{animation:glitch-r 7s infinite}
    .gb{animation:glitch-b 7s infinite}
    .gm{animation:glitch-m 7s infinite}
  </style>
  <defs>
    <pattern id="sc" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="transparent"/>
      <rect y="1" width="2" height="1" fill="#000" opacity=".08"/>
    </pattern>
    <filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gs"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity=".7"/>
    </radialGradient>
  </defs>

  <!-- CRT background -->
  <rect width="800" height="160" fill="#0a0a0c"/>
  <rect width="800" height="160" fill="url(#sc)"/>
  <rect width="800" height="160" fill="url(#vig)"/>

  <!-- Window chrome - outer bevel (cyberpunk: dark silver) -->
  <rect x="8" y="6" width="784" height="148" fill="none" stroke="#2a2a30" stroke-width="2"/>
  <!-- Inner bevel -->
  <rect x="10" y="8" width="780" height="144" fill="#0d0d10" stroke="#1a1a1f" stroke-width="1"/>

  <!-- Title bar - dark with neon underline -->
  <rect x="12" y="10" width="776" height="22" fill="#0a0a0c"/>
  <line x1="12" y1="32" x2="788" y2="32" stroke="#00d9ff" stroke-width=".5" opacity=".4"/>
  <!-- Title text -->
  <text x="22" y="25" font-family="'Courier New',monospace" font-size="11" fill="#00d9ff" opacity=".7" letter-spacing="1">VEDANT TONG</text>
  <text x="140" y="25" font-family="'Courier New',monospace" font-size="10" fill="#00ff88" opacity=".4">// ML/AI ENGINEER</text>

  <!-- Window buttons - cyberpunk style -->
  <rect x="730" y="14" width="14" height="14" fill="#0d0d10" stroke="#00d9ff" stroke-width=".5" opacity=".5"/>
  <text x="734" y="24" font-family="'Courier New',monospace" font-size="9" fill="#00d9ff" opacity=".4">_</text>
  <rect x="748" y="14" width="14" height="14" fill="#0d0d10" stroke="#00d9ff" stroke-width=".5" opacity=".5"/>
  <rect x="751" y="18" width="8" height="6" fill="none" stroke="#00d9ff" stroke-width=".5" opacity=".4"/>
  <rect x="766" y="14" width="14" height="14" fill="#0d0d10" stroke="#ff1744" stroke-width=".5" opacity=".5"/>
  <text x="770" y="24" font-family="'Courier New',monospace" font-size="9" fill="#ff1744" opacity=".5">X</text>

  <!-- Inner content area -->
  <rect x="14" y="34" width="772" height="112" fill="#0a0a0c"/>
  <rect x="14" y="34" width="772" height="112" fill="url(#sc)"/>

  <!-- NAME - chromatic aberration -->
  <text class="gr" x="30" y="72" font-family="'Courier New',monospace" font-size="38" font-weight="700" fill="#ff1744" opacity=".12" letter-spacing="-1">VEDANT TONG</text>
  <text class="gb" x="26" y="72" font-family="'Courier New',monospace" font-size="38" font-weight="700" fill="#0066ff" opacity=".12" letter-spacing="-1">VEDANT TONG</text>
  <text class="gm" x="28" y="72" font-family="'Courier New',monospace" font-size="38" font-weight="700" fill="#00d9ff" filter="url(#gl)" letter-spacing="-1">VEDANT TONG</text>

  <!-- Prompt line -->
  <text x="30" y="98" font-family="'Courier New',monospace" font-size="12" fill="#00d9ff" opacity=".5">C:\&gt;</text>
  <text x="78" y="98" font-family="'Courier New',monospace" font-size="12" fill="#00ff88" opacity=".8">rebuild landmark papers from scratch. no frameworks.</text>
  <rect x="470" y="88" width="7" height="13" fill="#00ff88" opacity=".8" class="cb"/>

  <!-- Status bar -->
  <rect x="12" y="140" width="776" height="12" fill="#0d0d10"/>
  <line x1="12" y1="140" x2="788" y2="140" stroke="#00d9ff" stroke-width=".3" opacity=".3"/>
  <text x="18" y="149" font-family="'Courier New',monospace" font-size="8" fill="#00d9ff" opacity=".35">19 PAPERS</text>
  <line x1="80" y1="141" x2="80" y2="150" stroke="#1a1a1f" stroke-width=".5"/>
  <text x="86" y="149" font-family="'Courier New',monospace" font-size="8" fill="#00ff88" opacity=".35">800+ TESTS</text>
  <line x1="148" y1="141" x2="148" y2="150" stroke="#1a1a1f" stroke-width=".5"/>
  <text x="154" y="149" font-family="'Courier New',monospace" font-size="8" fill="#ffaa00" opacity=".35">3 PUBLISHED</text>
  <line x1="228" y1="141" x2="228" y2="150" stroke="#1a1a1f" stroke-width=".5"/>
  <text x="234" y="149" font-family="'Courier New',monospace" font-size="8" fill="#00d9ff" opacity=".35">2 DEPLOYED</text>

  <!-- REC -->
  <circle cx="750" cy="146" r="2.5" fill="#ff1744" class="rb"/>

  <!-- Scanline roll -->
  <rect x="14" y="0" width="772" height="1.5" fill="#00d9ff" opacity=".03" class="sr"/>
</svg>
