  <g clip-path="url(#tickClip2)"><g class="tick2" font-size="9" fill="#000"><text x="490" y="405">1990 RNN +++ 1998 LeNet-5 +++ 1998 Naive Bayes +++ 1998 SVM +++ 2003 LDA +++ 2012 AlexNet +++ 2013 Word2Vec +++ 2014 GloVe +++ 2014 Seq2Seq +++ 2015 Bahdanau +++ 2015 ResNet +++ 2015 Faster R-CNN +++ 2015 FCN +++ 2015 U-Net +++ 2017 Transformer +++ 2018 ELMo +++ 2018 MobileNetV2 +++ 2019 BERT +++ 2021 ViT +++ NUMPY FIRST +++ 1990 RNN +++ 1998 LeNet-5 +++ 1998 Naive Bayes +++ 1998 SVM +++ 2003 LDA +++ 2012 AlexNet +++ 2013 Word2Vec +++ 2014 GloVe +++ 2014 Seq2Seq +++ 2015 Bahdanau +++ 2015 ResNet +++ 2015 Faster R-CNN +++ 2015 FCN +++ 2015 U-Net +++ 2017 Transformer +++ 2018 ELMo +++ 2018 MobileNetV2 +++ 2019 BERT +++ 2021 ViT +++ NUMPY FIRST +++ </text></g></g>
