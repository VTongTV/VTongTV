<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <style>
    text{font-family:'Courier New',monospace}
    @keyframes scanroll{0%{transform:translateY(-2px)}100%{transform:translateY(440px)}}
    .sr{animation:scanroll 5s linear infinite}
    @keyframes flicker{0%,97%,100%{opacity:1}98%{opacity:.92}}
    .fl{animation:flicker 6s linear infinite}
    @keyframes led{0%,100%{opacity:1}50%{opacity:.4}}
    .led{animation:led 1.4s ease-in-out infinite}
  </style>
  <defs>
    <pattern id="sc" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="transparent"/>
      <rect y="1" width="2" height="1" fill="#000" opacity=".06"/>
    </pattern>
    <clipPath id="tickClip2"><rect x="360" y="420" width="360" height="11"/></clipPath>
    @keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-2800px)}}
    .tick2{animation:tick 40s linear infinite}
  </defs>

  <rect width="800" height="440" fill="#008080"/>
  <rect width="800" height="440" fill="url(#sc)"/>

  <rect x="6" y="4" width="788" height="432" fill="#c0c0c0"/>
  <rect x="6" y="4" width="788" height="432" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="8" y="6" width="784" height="428" fill="none" stroke="#808080" stroke-width="1"/>

  <rect x="8" y="6" width="784" height="20" fill="#000080"/>
