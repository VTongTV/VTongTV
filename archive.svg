<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <style>
    @keyframes sr{0%{transform:translateY(-2px)}100%{transform:translateY(480px)}}
    @keyframes nd{0%,100%{opacity:.7}50%{opacity:1}}
    .sr{animation:sr 5s linear infinite}
    .nd{animation:nd 3s ease-in-out infinite}
  </style>
  <defs>
    <pattern id="sc" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="transparent"/>
      <rect y="1" width="2" height="1" fill="#000" opacity=".05"/>
    </pattern>
    <filter id="gl"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="480" fill="#0a0a0c"/>
  <rect width="800" height="480" fill="url(#sc)"/>

  <!-- Title bar -->
  <rect x="8" y="6" width="784" height="20" fill="#000080"/>
  <text x="18" y="20" font-family="'Courier New',monospace" font-size="10" fill="#fff" font-weight="700">THE ARCHIVE -- 19 PAPERS FROM SCRATCH</text>
  <rect x="730" y="8" width="16" height="16" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="731" y="9" width="14" height="14" fill="none" stroke="#fff" stroke-width="1"/>
  <text x="734" y="19" font-family="'Courier New',monospace" font-size="8" fill="#000">X</text>

  <!-- Grid: 4 columns, x positions at 14, 210, 406, 602 -->
  <!-- Tile size: 186w x 52h, gap: 6 -->

  <!-- ══ COLUMN 1: CLASSICAL (amber) ══ -->
  <text x="107" y="42" font-family="'Courier New',monospace" font-size="9" fill="#ffaa00" opacity=".6" text-anchor="middle" letter-spacing="2">CLASSICAL</text>

  <!-- RNN -->
  <rect x="14" y="50" width="186" height="50" fill="#0d0d10" stroke="#ffaa00" stroke-width=".5" opacity=".8"/>
  <rect x="14" y="50" width="3" height="50" fill="#ffaa00" opacity=".6"/>
  <text x="24" y="67" font-family="'Courier New',monospace" font-size="10" fill="#ffaa00" opacity=".5">1990</text>
  <text x="60" y="67" font-family="'Courier New',monospace" font-size="13" fill="#ffaa00" font-weight="700" filter="url(#gl)">RNN</text>
  <text x="24" y="84" font-family="'Courier New',monospace" font-size="8" fill="#ffaa00" opacity=".4">elman -- where it all starts</text>
  <text x="176" y="67" font-family="'Courier New',monospace" font-size="7" fill="#ffaa00" opacity=".3">NUMPY</text>

  <!-- LeNet-5 -->
  <rect x="14" y="106" width="186" height="50" fill="#0d0d10" stroke="#ffaa00" stroke-width=".5" opacity=".8"/>
  <rect x="14" y="106" width="3" height="50" fill="#ffaa00" opacity=".6"/>
  <text x="24" y="123" font-family="'Courier New',monospace" font-size="10" fill="#ffaa00" opacity=".5">1998</text>
  <text x="60" y="123" font-family="'Courier New',monospace" font-size="13" fill="#ffaa00" font-weight="700" filter="url(#gl)">LeNet-5</text>
  <text x="24" y="140" font-family="'Courier New',monospace" font-size="8" fill="#ffaa00" opacity=".4">lecun -- proved convolutions work</text>
  <text x="176" y="123" font-family="'Courier New',monospace" font-size="7" fill="#ffaa00" opacity=".3">NUMPY</text>

  <!-- Naive Bayes -->
  <rect x="14" y="162" width="186" height="50" fill="#0d0d10" stroke="#ffaa00" stroke-width=".5" opacity=".8"/>
  <rect x="14" y="162" width="3" height="50" fill="#ffaa00" opacity=".6"/>
  <text x="24" y="179" font-family="'Courier New',monospace" font-size="10" fill="#ffaa00" opacity=".5">1998</text>
  <text x="60" y="179" font-family="'Courier New',monospace" font-size="13" fill="#ffaa00" font-weight="700" filter="url(#gl)">Naive Bayes</text>
  <text x="24" y="196" font-family="'Courier New',monospace" font-size="8" fill="#ffaa00" opacity=".4">lewis -- BIM, multinomial, 2-Poisson</text>
  <text x="176" y="179" font-family="'Courier New',monospace" font-size="7" fill="#ffaa00" opacity=".3">NUMPY</text>

  <!-- SVM -->
  <rect x="14" y="218" width="186" height="50" fill="#0d0d10" stroke="#ffaa00" stroke-width=".5" opacity=".8"/>
  <rect x="14" y="218" width="3" height="50" fill="#ffaa00" opacity=".6"/>
  <text x="24" y="235" font-family="'Courier New',monospace" font-size="10" fill="#ffaa00" opacity=".5">1998</text>
  <text x="60" y="235" font-family="'Courier New',monospace" font-size="13" fill="#ffaa00" font-weight="700" filter="url(#gl)">SVM</text>
  <text x="24" y="252" font-family="'Courier New',monospace" font-size="8" fill="#ffaa00" opacity=".4">joachims -- SMO, 3 kernels, VC-dim</text>
  <text x="176" y="235" font-family="'Courier New',monospace" font-size="7" fill="#ffaa00" opacity=".3">NUMPY</text>

  <!-- ══ COLUMN 2: EMBEDDINGS (green) ══ -->
  <text x="303" y="42" font-family="'Courier New',monospace" font-size="9" fill="#00ff88" opacity=".6" text-anchor="middle" letter-spacing="2">EMBEDDINGS</text>

  <!-- LDA -->
  <rect x="210" y="50" width="186" height="50" fill="#0d0d10" stroke="#00ff88" stroke-width=".5" opacity=".8"/>
  <rect x="210" y="50" width="3" height="50" fill="#00ff88" opacity=".6"/>
  <text x="220" y="67" font-family="'Courier New',monospace" font-size="10" fill="#00ff88" opacity=".5">2003</text>
  <text x="256" y="67" font-family="'Courier New',monospace" font-size="13" fill="#00ff88" font-weight="700" filter="url(#gl)">LDA</text>
  <text x="220" y="84" font-family="'Courier New',monospace" font-size="8" fill="#00ff88" opacity=".4">blei -- variational inference, EM</text>
  <text x="372" y="67" font-family="'Courier New',monospace" font-size="7" fill="#00ff88" opacity=".3">NUMPY</text>

  <!-- Word2Vec -->
  <rect x="210" y="106" width="186" height="50" fill="#0d0d10" stroke="#00ff88" stroke-width=".5" opacity=".8"/>
  <rect x="210" y="106" width="3" height="50" fill="#00ff88" opacity=".6"/>
  <text x="220" y="123" font-family="'Courier New',monospace" font-size="10" fill="#00ff88" opacity=".5">2013</text>
  <text x="256" y="123" font-family="'Courier New',monospace" font-size="13" fill="#00ff88" font-weight="700" filter="url(#gl)">Word2Vec</text>
  <text x="220" y="140" font-family="'Courier New',monospace" font-size="8" fill="#00ff88" opacity=".4">mikolov -- CBOW, skip-gram, huffman</text>
  <text x="372" y="123" font-family="'Courier New',monospace" font-size="7" fill="#00ff88" opacity=".3">NUMPY</text>

  <!-- GloVe -->
  <rect x="210" y="162" width="186" height="50" fill="#0d0d10" stroke="#00ff88" stroke-width=".5" opacity=".8"/>
  <rect x="210" y="162" width="3" height="50" fill="#00ff88" opacity=".6"/>
  <text x="220" y="179" font-family="'Courier New',monospace" font-size="10" fill="#00ff88" opacity=".5">2014</text>
  <text x="256" y="179" font-family="'Courier New',monospace" font-size="13" fill="#00ff88" font-weight="700" filter="url(#gl)">GloVe</text>
  <text x="220" y="196" font-family="'Courier New',monospace" font-size="8" fill="#00ff88" opacity=".4">pennington -- 71.7% analogy accuracy</text>
  <text x="372" y="179" font-family="'Courier New',monospace" font-size="7" fill="#00ff88" opacity=".3">NUMPY</text>

  <!-- ══ COLUMN 3: NLP (teal) ══ -->
  <text x="499" y="42" font-family="'Courier New',monospace" font-size="9" fill="#00d9ff" opacity=".6" text-anchor="middle" letter-spacing="2">NLP / SEQUENCE</text>

  <!-- Seq2Seq -->
  <rect x="406" y="50" width="186" height="50" fill="#0d0d10" stroke="#00d9ff" stroke-width=".5" opacity=".8"/>
  <rect x="406" y="50" width="3" height="50" fill="#00d9ff" opacity=".6"/>
  <text x="416" y="67" font-family="'Courier New',monospace" font-size="10" fill="#00d9ff" opacity=".5">2014</text>
  <text x="452" y="67" font-family="'Courier New',monospace" font-size="13" fill="#00d9ff" font-weight="700" filter="url(#gl)">Seq2Seq</text>
  <text x="416" y="84" font-family="'Courier New',monospace" font-size="8" fill="#00d9ff" opacity=".4">sutskever -- 4-layer LSTM, beam search</text>
  <text x="563" y="67" font-family="'Courier New',monospace" font-size="7" fill="#00d9ff" opacity=".3">TORCH</text>

  <!-- Bahdanau -->
  <rect x="406" y="106" width="186" height="50" fill="#0d0d10" stroke="#00d9ff" stroke-width=".5" opacity=".8"/>
  <rect x="406" y="106" width="3" height="50" fill="#00d9ff" opacity=".6"/>
  <text x="416" y="123" font-family="'Courier New',monospace" font-size="10" fill="#00d9ff" opacity=".5">2015</text>
  <text x="452" y="123" font-family="'Courier New',monospace" font-size="13" fill="#00d9ff" font-weight="700" filter="url(#gl)">Bahdanau</text>
  <text x="416" y="140" font-family="'Courier New',monospace" font-size="8" fill="#00d9ff" opacity=".4">soft attention, maxout deep output</text>
  <text x="563" y="123" font-family="'Courier New',monospace" font-size="7" fill="#00d9ff" opacity=".3">TORCH</text>

  <!-- Transformer -->
  <rect x="406" y="162" width="186" height="50" fill="#0d0d10" stroke="#00d9ff" stroke-width=".5" opacity=".8"/>
  <rect x="406" y="162" width="3" height="50" fill="#00d9ff" opacity=".6"/>
  <text x="416" y="179" font-family="'Courier New',monospace" font-size="10" fill="#00d9ff" opacity=".5">2017</text>
  <text x="452" y="179" font-family="'Courier New',monospace" font-size="13" fill="#00d9ff" font-weight="700" filter="url(#gl)">Transformer</text>
  <text x="416" y="196" font-family="'Courier New',monospace" font-size="8" fill="#00d9ff" opacity=".4">vaswani -- 217 commits, full enc-dec</text>
  <text x="563" y="179" font-family="'Courier New',monospace" font-size="7" fill="#00d9ff" opacity=".3">TORCH</text>

  <!-- ELMo -->
  <rect x="406" y="218" width="186" height="50" fill="#0d0d10" stroke="#00d9ff" stroke-width=".5" opacity=".8"/>
  <rect x="406" y="218" width="3" height="50" fill="#00d9ff" opacity=".6"/>
  <text x="416" y="235" font-family="'Courier New',monospace" font-size="10" fill="#00d9ff" opacity=".5">2018</text>
  <text x="452" y="235" font-family="'Courier New',monospace" font-size="13" fill="#00d9ff" font-weight="700" filter="url(#gl)">ELMo</text>
  <text x="416" y="252" font-family="'Courier New',monospace" font-size="8" fill="#00d9ff" opacity=".4">peters -- biLM, char CNN, 6 tasks</text>
  <text x="563" y="235" font-family="'Courier New',monospace" font-size="7" fill="#00d9ff" opacity=".3">TORCH</text>

  <!-- BERT -->
  <rect x="406" y="274" width="186" height="50" fill="#0d0d10" stroke="#00d9ff" stroke-width=".5" opacity=".8"/>
  <rect x="406" y="274" width="3" height="50" fill="#00d9ff" opacity=".6"/>
  <text x="416" y="291" font-family="'Courier New',monospace" font-size="10" fill="#00d9ff" opacity=".5">2019</text>
  <text x="452" y="291" font-family="'Courier New',monospace" font-size="13" fill="#00d9ff" font-weight="700" filter="url(#gl)">BERT</text>
  <text x="416" y="308" font-family="'Courier New',monospace" font-size="8" fill="#00d9ff" opacity=".4">devlin -- BERT-B/L, MLM+NSP, 131 tests</text>
  <text x="563" y="291" font-family="'Courier New',monospace" font-size="7" fill="#00d9ff" opacity=".3">TORCH</text>

  <!-- ══ COLUMN 4: VISION (blood) ══ -->
  <text x="695" y="42" font-family="'Courier New',monospace" font-size="9" fill="#ff1744" opacity=".6" text-anchor="middle" letter-spacing="2">VISION</text>

  <!-- AlexNet -->
  <rect x="602" y="50" width="186" height="50" fill="#0d0d10" stroke="#ff1744" stroke-width=".5" opacity=".8"/>
  <rect x="602" y="50" width="3" height="50" fill="#ff1744" opacity=".6"/>
  <text x="612" y="67" font-family="'Courier New',monospace" font-size="10" fill="#ff1744" opacity=".5">2012</text>
  <text x="648" y="67" font-family="'Courier New',monospace" font-size="13" fill="#ff1744" font-weight="700" filter="url(#gl)">AlexNet</text>
  <text x="612" y="84" font-family="'Courier New',monospace" font-size="8" fill="#ff1744" opacity=".4">krizhevsky -- no frameworks. numpy/cupy</text>
  <text x="764" y="67" font-family="'Courier New',monospace" font-size="7" fill="#ff1744" opacity=".3">NUMPY</text>

  <!-- ResNet -->
  <rect x="602" y="106" width="186" height="50" fill="#0d0d10" stroke="#ff1744" stroke-width=".5" opacity=".8"/>
  <rect x="602" y="106" width="3" height="50" fill="#ff1744" opacity=".6"/>
  <text x="612" y="123" font-family="'Courier New',monospace" font-size="10" fill="#ff1744" opacity=".5">2015</text>
  <text x="648" y="123" font-family="'Courier New',monospace" font-size="13" fill="#ff1744" font-weight="700" filter="url(#gl)">ResNet</text>
  <text x="612" y="140" font-family="'Courier New',monospace" font-size="8" fill="#ff1744" opacity=".4">he -- 18-152-1202, CIFAR-10 6.43%</text>
  <text x="764" y="123" font-family="'Courier New',monospace" font-size="7" fill="#ff1744" opacity=".3">TORCH</text>

  <!-- Faster R-CNN -->
  <rect x="602" y="162" width="186" height="50" fill="#0d0d10" stroke="#ff1744" stroke-width=".5" opacity=".8"/>
  <rect x="602" y="162" width="3" height="50" fill="#ff1744" opacity=".6"/>
  <text x="612" y="179" font-family="'Courier New',monospace" font-size="10" fill="#ff1744" opacity=".5">2015</text>
  <text x="648" y="179" font-family="'Courier New',monospace" font-size="12" fill="#ff1744" font-weight="700" filter="url(#gl)">Faster R-CNN</text>
  <text x="612" y="196" font-family="'Courier New',monospace" font-size="8" fill="#ff1744" opacity=".4">ren -- RPN, anchor pyramid, 4-step</text>
  <text x="764" y="179" font-family="'Courier New',monospace" font-size="7" fill="#ff1744" opacity=".3">TORCH</text>

  <!-- FCN -->
  <rect x="602" y="218" width="186" height="50" fill="#0d0d10" stroke="#ff1744" stroke-width=".5" opacity=".8"/>
  <rect x="602" y="218" width="3" height="50" fill="#ff1744" opacity=".6"/>
  <text x="612" y="235" font-family="'Courier New',monospace" font-size="10" fill="#ff1744" opacity=".5">2015</text>
  <text x="648" y="235" font-family="'Courier New',monospace" font-size="13" fill="#ff1744" font-weight="700" filter="url(#gl)">FCN</text>
  <text x="612" y="252" font-family="'Courier New',monospace" font-size="8" fill="#ff1744" opacity=".4">long -- fully convolutional seg</text>
  <text x="764" y="235" font-family="'Courier New',monospace" font-size="7" fill="#ff1744" opacity=".3">TORCH</text>

  <!-- U-Net -->
  <rect x="602" y="274" width="186" height="50" fill="#0d0d10" stroke="#ff1744" stroke-width=".5" opacity=".8"/>
  <rect x="602" y="274" width="3" height="50" fill="#ff1744" opacity=".6"/>
  <text x="612" y="291" font-family="'Courier New',monospace" font-size="10" fill="#ff1744" opacity=".5">2015</text>
  <text x="648" y="291" font-family="'Courier New',monospace" font-size="13" fill="#ff1744" font-weight="700" filter="url(#gl)">U-Net</text>
  <text x="612" y="308" font-family="'Courier New',monospace" font-size="8" fill="#ff1744" opacity=".4">ronneberger -- overlap-tile, elastic</text>
  <text x="764" y="291" font-family="'Courier New',monospace" font-size="7" fill="#ff1744" opacity=".3">TORCH</text>

  <!-- MobileNetV2 -->
  <rect x="602" y="330" width="186" height="50" fill="#0d0d10" stroke="#ff1744" stroke-width=".5" opacity=".8"/>
  <rect x="602" y="330" width="3" height="50" fill="#ff1744" opacity=".6"/>
  <text x="612" y="347" font-family="'Courier New',monospace" font-size="10" fill="#ff1744" opacity=".5">2018</text>
  <text x="648" y="347" font-family="'Courier New',monospace" font-size="12" fill="#ff1744" font-weight="700" filter="url(#gl)">MobileNetV2</text>
  <text x="612" y="364" font-family="'Courier New',monospace" font-size="8" fill="#ff1744" opacity=".4">sandler -- inverted residuals, linear</text>
  <text x="764" y="347" font-family="'Courier New',monospace" font-size="7" fill="#ff1744" opacity=".3">TORCH</text>

  <!-- ViT -->
  <rect x="602" y="386" width="186" height="50" fill="#0d0d10" stroke="#ff1744" stroke-width=".5" opacity=".8"/>
  <rect x="602" y="386" width="3" height="50" fill="#ff1744" opacity=".6"/>
  <text x="612" y="403" font-family="'Courier New',monospace" font-size="10" fill="#ff1744" opacity=".5">2021</text>
  <text x="648" y="403" font-family="'Courier New',monospace" font-size="13" fill="#ff1744" font-weight="700" filter="url(#gl)">ViT</text>
  <text x="612" y="420" font-family="'Courier New',monospace" font-size="8" fill="#ff1744" opacity=".4">dosovitskiy -- patch embed, 252 tests</text>
  <text x="764" y="403" font-family="'Courier New',monospace" font-size="7" fill="#ff1744" opacity=".3">TORCH</text>

  <!-- Status bar -->
  <rect x="8" y="450" width="784" height="24" fill="#c0c0c0"/>
  <rect x="8" y="450" width="784" height="1" fill="#808080"/>
  <text x="16" y="466" font-family="'Courier New',monospace" font-size="9" fill="#000">19 PAPERS</text>
  <line x1="78" y1="451" x2="78" y2="473" stroke="#808080" stroke-width="1"/>
  <text x="84" y="466" font-family="'Courier New',monospace" font-size="9" fill="#000">31 YEARS</text>
  <line x1="144" y1="451" x2="144" y2="473" stroke="#808080" stroke-width="1"/>
  <text x="150" y="466" font-family="'Courier New',monospace" font-size="9" fill="#ff1744" font-weight="700">ZERO FRAMEWORKS</text>
  <line x1="282" y1="451" x2="282" y2="473" stroke="#808080" stroke-width="1"/>
  <text x="288" y="466" font-family="'Courier New',monospace" font-size="9" fill="#000">7 NUMPY-ONLY</text>
  <line x1="378" y1="451" x2="378" y2="473" stroke="#808080" stroke-width="1"/>
  <text x="384" y="466" font-family="'Courier New',monospace" font-size="9" fill="#000">12 PYTORCH</text>

  <!-- Scanline roll -->
  <rect x="8" y="0" width="784" height="1.5" fill="#00d9ff" opacity=".03" class="sr"/>
</svg>
