  <rect x="725" y="9" width="14" height="14" fill="none" stroke="#fff" stroke-width="1"/>
  <line x1="728" y1="19" x2="736" y2="13" stroke="#000" stroke-width="1.5"/>
  <rect x="744" y="8" width="16" height="16" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="745" y="9" width="14" height="14" fill="none" stroke="#fff" stroke-width="1"/>
  <rect x="748" y="12" width="8" height="7" fill="none" stroke="#000" stroke-width="1"/>
  <rect x="764" y="8" width="16" height="16" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="765" y="9" width="14" height="14" fill="none" stroke="#fff" stroke-width="1"/>
  <line x1="768" y1="16" x2="776" y2="16" stroke="#000" stroke-width="1.5"/>

