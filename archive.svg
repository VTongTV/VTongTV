<svg xmlns="http://www.w3.org/2000/svg" width="800" height="454" viewBox="0 0 800 454">
  <style>
    text{font-family:'Courier New',monospace}
    @keyframes tileIn{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes barPulse{0%,100%{opacity:1}50%{opacity:.45}}
    @keyframes scanroll{0%{transform:translateY(-2px)}100%{transform:translateY(454px)}}
    @keyframes titleGlow{0%,100%{opacity:1}50%{opacity:.75}}
    .ti{animation:tileIn .52s cubic-bezier(.2,.8,.2,1) both}
    .r1{animation-delay:.03s}.r2{animation-delay:.11s}.r3{animation-delay:.19s}.r4{animation-delay:.27s}.r5{animation-delay:.35s}.r6{animation-delay:.43s}.r7{animation-delay:.51s}
    .bar{animation:barPulse 2.6s ease-in-out infinite}
    .b1{animation-delay:0s}.b2{animation-delay:.35s}.b3{animation-delay:.7s}.b4{animation-delay:1.05s}
    .sr{animation:scanroll 4s linear infinite}
    .tg{animation:titleGlow 3s ease-in-out infinite}
    .ti{transition:filter .18s}
    .ti:hover{filter:brightness(1.06) drop-shadow(0 2px 6px rgba(0,0,0,.12))}
    @keyframes aGlitch{0%,87%,87.8%,88.4%,91%,91.8%,100%{transform:translate(0,0);filter:none}87.3%{transform:translate(1.3px,0);filter:contrast(1.12) hue-rotate(5deg)}87.6%{transform:translate(-1.1px,0)}91.3%{transform:translate(.9px,0)}91.6%{transform:translate(-.8px,0)}}
    .ag{animation:aGlitch 7.5s linear 1.5s infinite}
    @keyframes aSlice{0%,87%,87.5%,88%,91%,91.7%,100%{opacity:0;transform:translateX(0)}87.2%{opacity:.8;transform:translateX(4px)}87.4%{opacity:0}91.4%{opacity:.65;transform:translateX(-3px)}}
    .as1{animation:aSlice 7.5s steps(1) 1.5s infinite}
    .as2{animation:aSlice 7.5s steps(1) 1.65s infinite}
    @keyframes aBurst{0%,87%,87.6%,91.2%,91.8%,100%{opacity:0}87.3%{opacity:.06}91.5%{opacity:.05}}
    .ab{animation:aBurst 7.5s steps(1) 1.5s infinite}
  </style>
